{%- assign lang = page.lang | default: site.lang -%}
{%- assign t = site.data.i18n[lang] -%}
  <footer class="site-footer">
    <div>
      <nav>
        <a href="{{ t.home }}">{{ t.title }}</a>
        <a href="{{ t.home }}support/">{{ t.support }}</a>
        <a href="{{ t.home }}privacy/">{{ t.privacy }}</a>
        {%- if page.alternate %}
        <a href="{{ page.alternate }}" hreflang="{{ t.other_lang }}" lang="{{ t.other_lang }}">{{ t.other_lang_name }}</a>
        {%- endif %}
      </nav>
      <span>© 2026 {{ t.company }}</span>
    </div>
  </footer>
  <script>
    // Links to other sites open in a new tab.
    document.querySelectorAll('a[href^="http"]').forEach(function (link) {
      if (link.host !== location.host) { link.target = "_blank"; link.rel = "noopener"; }
    });
  </script>
