<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <style>
    :root {
      --bg: #f4f7fa;
      --surface: #ffffff;
      --fg: #1f2933;
      --muted: #5f6c7b;
      --line: #d9e1e8;
      --accent: #d9682a;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141a21; --surface: #1d252e; --fg: #e6edf3; --muted: #9aa8b6; --line: #2e3a46; --accent: #f08c47; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      font-size: 16px; line-height: 1.8;
    }
    header, main, footer { max-width: 760px; margin: 0 auto; padding-inline: 20px; }
    header { padding-block: 20px 0; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
    header a.home { font-weight: 700; color: var(--fg); text-decoration: none; font-size: 1.05rem; }
    nav { display: flex; gap: 16px; font-size: 0.9rem; }
    main { padding-block: 8px 40px; }
    article { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 24px 24px; }
    h1 { font-size: 1.6rem; line-height: 1.4; text-wrap: balance; }
    h2 { font-size: 1.2rem; margin-top: 2em; padding-top: 0.6em; border-top: 1px solid var(--line); }
    h3 { font-size: 1.05rem; margin-top: 1.6em; }
    a { color: var(--accent); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
    .table-wrap, table { display: block; overflow-x: auto; }
    table { border-collapse: collapse; font-size: 0.92rem; margin: 1em 0; }
    th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
    th { background: var(--bg); }
    li { margin: 0.2em 0; }
    footer { padding-block: 0 32px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <a class="home" href="/">{{ site.title }}</a>
    <nav>
      <a href="/support/">サポート</a>
      <a href="/privacy/">プライバシーポリシー</a>
    </nav>
  </header>
  <main>
    <article>
      {{ content }}
    </article>
  </main>
  <footer>合同会社LINKA ・ info@linka-inc.jp</footer>
</body>
</html>
